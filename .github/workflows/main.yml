# ============================================================================
# MAMM-KEYBOARD-1 - WORKFLOW DE COMPILACIÓN ANDROID
# ARQUITECTO: MARCOS ABEL MENDIETA MOLINA
# ============================================================================
name: 🔥 Build MAMM-KEYBOARD-1

on:
  push:
    branches: [ main ]
  workflow_dispatch:        # Permite lanzar el build manualmente desde GitHub

# ============================================================================
# CONFIGURACIÓN GLOBAL DEL ENTORNO
# ============================================================================
env:
  # Ruta del SDK que prepararemos manualmente (evita que Buildozer descargue uno nuevo)
  ANDROID_SDK_ROOT: /home/runner/android-sdk
  # Variables para que Buildozer encuentre el SDK
  ANDROID_HOME: /home/runner/android-sdk
  # Activamos la aceptación de licencias a nivel de entorno (refuerzo)
  ANDROID_SDK_LICENSE: accepted

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # -----------------------------------------------------------------------
      # 1. CHECKOUT DEL CÓDIGO FUENTE
      # -----------------------------------------------------------------------
      - name: 📥 Checkout source code
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. CONFIGURAR PYTHON 3.9
      # -----------------------------------------------------------------------
      - name: 🐍 Setup Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      # -----------------------------------------------------------------------
      # 3. DEPENDENCIAS DEL SISTEMA OPERATIVO
      # -----------------------------------------------------------------------
      - name: 🛠️ Dependencias del sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y openjdk-17-jdk git zip unzip libffi-dev libssl-dev libltdl-dev

      # -----------------------------------------------------------------------
      # 4. INSTALAR BUILDOZER Y CYTHON
      # -----------------------------------------------------------------------
      - name: 📦 Instalar Buildozer y Cython
        run: |
          pip install --upgrade pip
          pip install "cython<3.0" buildozer

      # -----------------------------------------------------------------------
      # 5. PREPARAR SDK DE ANDROID PERSONALIZADO Y ACEPTAR LICENCIAS
      #    Este paso es el núcleo que evita el error de licencias.
      # -----------------------------------------------------------------------
      - name: 🔧 Preparar SDK y forzar licencias
        run: |
          # Usamos la ruta definida en las variables de entorno
          export ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT
          mkdir -p $ANDROID_SDK_ROOT

          # Descargar command-line tools de Android (versión estable)
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d $ANDROID_SDK_ROOT/

          # Estructura requerida por sdkmanager: .../cmdline-tools/latest/
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools/latest

          # Mover todo el contenido extraído a 'latest'
          for item in $ANDROID_SDK_ROOT/cmdline-tools/*; do
            if [ "$item" != "$ANDROID_SDK_ROOT/cmdline-tools/latest" ]; then
              mv "$item"/* $ANDROID_SDK_ROOT/cmdline-tools/latest/ 2>/dev/null || true
              rm -rf "$item"
            fi
          done

          # Aceptar todas las licencias de forma automática
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses --sdk_root=$ANDROID_SDK_ROOT

          # Instalar los componentes necesarios (build-tools, plataforma, platform-tools)
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT \
            "build-tools;34.0.0" \
            "platforms;android-34" \
            "platform-tools"

      # -----------------------------------------------------------------------
      # 6. COMPILAR EL APK CON BUILDOZER
      #    Con el SDK ya listo y licencias aceptadas, Buildozer no pedirá nada.
      # -----------------------------------------------------------------------
      - name: 🚀 Compilar APK
        run: |
          export ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export PATH=$PATH:$ANDROID_SDK_ROOT/platform-tools
          buildozer -v android debug

      # -----------------------------------------------------------------------
      # 7. (OPCIONAL) FIRMAR EL APK SI SE PROPORCIONAN SECRETOS
      #    Descomenta y configura los secretos en el repositorio.
      # -----------------------------------------------------------------------
      # - name: 🔐 Firmar APK (release)
      #   if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      #   env:
      #     KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
      #     KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      #     KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      #     KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      #   run: |
      #     echo "$KEYSTORE" | base64 -d > mamm.keystore
      #     # Asumiendo que el APK se generó como bin/*.apk
      #     apk_path=$(ls bin/*.apk | head -1)
      #     jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 -keystore mamm.keystore \
      #       -storepass $KEYSTORE_PASSWORD -keypass $KEY_PASSWORD \
      #       $apk_path $KEY_ALIAS

      # -----------------------------------------------------------------------
      # 8. SUBIR EL APK COMO ARTEFACTO (siempre disponible)
      # -----------------------------------------------------------------------
      - name: ⬆️ Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: MAMM-KEYBOARD-1-${{ github.run_number }}
          path: bin/*.apk

