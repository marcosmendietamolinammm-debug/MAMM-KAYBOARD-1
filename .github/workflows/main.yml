name: 🔥 Build & Sign MAMM-KEYBOARD-1

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout source code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 💾 Cache Buildozer
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}

      - name: 🛠️ Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            libtool \
            libffi-dev \
            libssl-dev \
            libltdl-dev \
            openjdk-17-jdk-headless \
            git \
            wget \
            unzip
          pip install --user buildozer cython

      - name: 🔑 Accept Android SDK licenses (FORZADO)
        run: |
          export PATH=$PATH:$HOME/.local/bin
          # Instalar sdkmanager si no está
          if [ ! -f $HOME/.local/bin/sdkmanager ]; then
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q commandlinetools-linux-11076708_latest.zip
            mkdir -p $HOME/android-sdk/cmdline-tools
            mv cmdline-tools $HOME/android-sdk/cmdline-tools/latest
            export ANDROID_SDK_ROOT=$HOME/android-sdk
            export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin
          fi
          # Aceptar todas las licencias
          yes | sdkmanager --licenses || true

      - name: 📦 Build APK with Buildozer
        run: |
          export PATH=$PATH:$HOME/.local/bin
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          buildozer android debug
        env:
          ACCEPT_SDK_LICENSE: "yes"

      - name: ⬆️ Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: MAMM-KEYBOARD-1-APK
          path: bin/*.apk
