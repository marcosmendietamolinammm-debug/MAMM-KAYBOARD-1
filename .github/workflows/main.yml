name: 📦 Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # permite ejecución manual

jobs:
  build-android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Solo arm64-v8a para reducir tiempo y tamaño
        arch: [ arm64-v8a ]

    steps:
      - name: 🛎️ Checkout del código
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: 📦 Instalar dependencias del sistema
        run: |
          sudo apt-get update -y
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev \
            libltdl-dev libusb-1.0-0-dev

      - name: 🔧 Instalar Buildozer y Cython
        run: |
          pip install --upgrade pip setuptools wheel
          pip install --upgrade Cython==0.29.33 buildozer

      - name: 📥 Preparar SDK de Android y aceptar licencias
        run: |
          export ANDROID_SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $ANDROID_SDK_ROOT
          # Descargar command-line tools solo si no existe sdkmanager
          if [ ! -f "$ANDROID_SDK_ROOT/tools/bin/sdkmanager" ]; then
            echo "Descargando Android command-line tools..."
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
            unzip -q cmdline-tools.zip -d $ANDROID_SDK_ROOT/
            mkdir -p $ANDROID_SDK_ROOT/tools
            cp -r $ANDROID_SDK_ROOT/cmdline-tools/* $ANDROID_SDK_ROOT/tools/
            rm -rf $ANDROID_SDK_ROOT/cmdline-tools cmdline-tools.zip
          fi
          # Aceptar todas las licencias
          echo "Aceptando licencias del SDK..."
          yes | $ANDROID_SDK_ROOT/tools/bin/sdkmanager --licenses || true
          # Instalar componentes necesarios (build-tools, platform) para que buildozer no lo haga y falle por licencias
          $ANDROID_SDK_ROOT/tools/bin/sdkmanager "build-tools;34.0.0" "platforms;android-34" "platform-tools" || true

      - name: 🚀 Compilar APK con Buildozer
        run: |
          export ANDROID_SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk
          buildozer -v android debug

      - name: 📤 Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: MAMM-KEYBOARD-1-${{ github.run_id }}-${{ matrix.arch }}
          path: bin/*.apk
