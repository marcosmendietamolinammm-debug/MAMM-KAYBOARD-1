name: Build MAMM-KEYBOARD-1 APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      - name: 🐍 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: 🛠️ Herramientas Pesadas (El motor de 40 min)
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool libffi-dev libssl-dev libltdl-dev openjdk-17-jdk-headless
          pip install Cython==3.0.11 buildozer
      - name: 📦 Compilación MAMM
        run: |
          yes | buildozer android debug
      - name: ⬆️ Entrega APK
        uses: actions/upload-artifact@v4
        with:
          name: MAMM-KEYBOARD-1-APK
          path: ./bin/*.apk
