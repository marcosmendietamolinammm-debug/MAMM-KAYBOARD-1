name: Build MAMM-KEYBOARD-1 APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Instalación de Maquinaria
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool libffi-dev libssl-dev libltdl-dev openjdk-17-jdk-headless
          pip install Cython==3.0.11 buildozer
      - name: Construcción MAMM
        run: yes | buildozer android debug
      - name: Entrega APK
        uses: actions/upload-artifact@v4
        with:
          name: MAMM-KEYBOARD-1-APK
          path: ./bin/*.apk
