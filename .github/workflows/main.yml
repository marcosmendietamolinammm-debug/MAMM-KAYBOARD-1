name: Build MAMM
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Build
        uses: ArtemSBulgakov/buildozer-action@v1.6.1
        with:
          command: buildozer android debug
          workdir: .
      - name: Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MAMM-APK
          path: ./bin/*.apk
