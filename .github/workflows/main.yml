name: "MAMM FINAL RECOVERY"
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "MAMM FINAL RECOVERY"
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: "MAMM FINAL RECOVERY"
        uses: ArtemSBulgakov/buildozer-action@v1.5.0
        with:
          command: buildozer android debug
          workdir: .
      - name: "MAMM FINAL RECOVERY"
        uses: actions/upload-artifact@v4
        with:
          name: "MAMM FINAL RECOVERY"
          path: ./bin/*.apk
